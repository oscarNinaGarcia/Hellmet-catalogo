<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELLMET — Equipos de Cocción</title>
<link rel="icon" href="assets/file_000000004598720ea3542ff2cbdaad59.png" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="site-header"></header>

<main>
  <div class="wrap">

    <!-- Hero: título grande + carrusel automático + bienvenida -->
    <section class="hero">
      <span class="hero-eyebrow">Equipos de cocción</span>
      <h1 class="hero-title">HELLMET</h1>

      <div class="carousel carousel--drag hero-carousel">
        <div class="carousel-viewport" id="hero-viewport">
          <div class="carousel-track" id="hero-track"></div>
        </div>
      </div>

      <p class="welcome">
        Bienvenido a HELLMET. Diseñamos y fabricamos equipos de cocción para negocios
        que no se detienen: panaderías, pizzerías, parrillas y restaurantes. Explora
        nuestras líneas de producto y encuentra el equipo ideal para tu operación.
      </p>
    </section>

    <!-- Grilla de categorías generales -->
    <section class="category-section" aria-label="Categorías de productos">
      <div class="section-label">
        <span class="num">01</span>
        <h2>Nuestras líneas</h2>
      </div>
      <div class="category-grid" id="category-grid"></div>
    </section>

  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/home.js"></script>
